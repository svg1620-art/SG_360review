{% extends "base.html" %}
{% block title %}Вход{% endblock %}
{% block content %}
<div class="auth-card">
  <h1>Вход</h1>
  <form method="post">
    <label>Email</label>
    <input name="email" type="email" required autofocus>
    <label>Пароль</label>
    <input name="password" type="password" required>
    <button type="submit">Войти</button>
  </form>
  <p class="muted">Нет аккаунта? <a href="{{ url_for('auth.register') }}">Регистрация компании</a></p>
</div>
{% endblock %}
