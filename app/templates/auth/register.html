{% extends "base.html" %}
{% block title %}Регистрация{% endblock %}
{% block content %}
<div class="auth-card">
  <h1>Регистрация компании</h1>
  <form method="post">
    <label>Название компании</label>
    <input name="company_name" required autofocus>
    <label>Ваше имя</label>
    <input name="full_name">
    <label>Email админа</label>
    <input name="email" type="email" required>
    <label>Пароль (от 8 символов)</label>
    <input name="password" type="password" minlength="8" required>
    <button type="submit">Создать компанию</button>
  </form>
  <p class="muted">Уже есть аккаунт? <a href="{{ url_for('auth.login') }}">Войти</a></p>
</div>
{% endblock %}
